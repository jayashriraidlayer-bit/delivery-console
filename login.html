<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sign In — Delivery Zone Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #f7f8f6; --ink: #17211f; --ink-soft: #4a5551; --line: rgba(23, 33, 31, 0.12);
    --panel: #ffffff; --accent: #2e6f5e; --accent-soft: #dcebe5; --alert: #b84a3e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12181a; --ink: #eef2f0; --ink-soft: #a4b0ac; --line: rgba(238, 242, 240, 0.12);
      --panel: #182120; --accent: #57b596; --accent-soft: rgba(87, 181, 150, 0.16); --alert: #e0776a;
    }
  }
  :root[data-theme="dark"] {
    --paper: #12181a; --ink: #eef2f0; --ink-soft: #a4b0ac; --line: rgba(238, 242, 240, 0.12);
    --panel: #182120; --accent: #57b596; --accent-soft: rgba(87, 181, 150, 0.16); --alert: #e0776a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: "Sora", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; padding-block: 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 18px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 8px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand-mark svg { width: 18px; height: 18px; }
  h1 { font-size: 17px; margin: 0; font-weight: 700; }
  .sub { font-size: 12.5px; color: var(--ink-soft); margin: 2px 0 0; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); font-weight: 600; }
  input {
    font: inherit; padding: 11px 12px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 14px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; font-weight: 700; font-size: 14px; padding: 13px; border-radius: 10px;
    border: none; cursor: pointer; background: var(--accent); color: white;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error {
    display: none; font-size: 12.5px; color: var(--alert);
    background: color-mix(in srgb, var(--alert) 12%, transparent);
    padding: 9px 11px; border-radius: 8px;
  }
  .error.show { display: block; }
  .hint {
    font-size: 11px; color: var(--ink-soft); text-align: center;
    font-family: "JetBrains Mono", monospace;
  }
</style>
</head>
<body>

<form class="card" id="loginForm" novalidate>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 12L11 4L21 8V16L11 20L3 12Z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="11" cy="12" r="2" fill="white"/>
      </svg>
    </div>
    <div>
      <h1>Palit Zone Console</h1>
      <p class="sub">Sign in to view your delivery zones</p>
    </div>
  </div>

  <div class="error" id="errorBox"></div>

  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="username" required value="owner@palitlogistics.ph" />
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required value="Owner_Pass123" />
  </div>

  <button type="submit" id="submitBtn">Sign in</button>
  <div class="hint">Demo account pre-filled &mdash; just press Sign in</div>
</form>

<script>
(function () {
  var form = document.getElementById("loginForm");
  var errorBox = document.getElementById("errorBox");
  var submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errorBox.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in…";

    fetch("api/login.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      })
    }).then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, data: data }; });
    }).then(function (result) {
      if (!result.ok) throw new Error(result.data.error || "Sign in failed");
      window.location.href = "delivery-ops-map.html";
    }).catch(function (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("show");
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign in";
    });
  });
})();
</script>
</body>
</html>
